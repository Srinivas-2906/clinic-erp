appId: host.exp.exponent
---
# Requires Metro + Expo Go; set MAESTRO_CLINIC_* env vars.
- launchApp
- tapOn:
    id: "login-email"
    optional: true
- inputText: "${MAESTRO_CLINIC_EMAIL}"
- tapOn:
    id: "login-password"
    optional: true
- inputText: "${MAESTRO_CLINIC_PASSWORD}"
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "today-screen"
- tapOn:
    id: "today-refresh"
- assertVisible:
    id: "tab-today"
