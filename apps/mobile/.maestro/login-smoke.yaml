appId: in.kaana.clinicerp
---
- launchApp:
    clearState: true
- runFlow: dismiss-android-anr.yaml
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 90000
- tapOn:
    id: "login-tenant"
    optional: true
- eraseText
- inputText: "${MAESTRO_CLINIC_TENANT}"
- tapOn:
    id: "login-email"
- eraseText
- inputText: "${MAESTRO_CLINIC_EMAIL}"
- tapOn:
    id: "login-password"
- eraseText
- inputText: "${MAESTRO_CLINIC_PASSWORD}"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 60000
