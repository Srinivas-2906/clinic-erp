appId: host.exp.exponent
---
# Receptionist: Today queue check-in when action visible (data-dependent).
- launchApp
- tapOn:
    id: "login-email"
    optional: true
- inputText: "${MAESTRO_CLINIC_EMAIL}"
- tapOn:
    id: "login-password"
    optional: true
- inputText: "${MAESTRO_CLINIC_PASSWORD}"
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "today-screen"
- tapOn:
    id: "today-refresh"
- tapOn:
    id: "today-action-.*"
    optional: true
