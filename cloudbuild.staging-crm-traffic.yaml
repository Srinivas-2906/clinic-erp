steps:
  - id: crm-traffic-cutover
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq python3 curl >/dev/null
        test "$PROJECT_ID" = "clinic-erp-staging"
        REGION=asia-south1
        CRMSVC=kaana-clinic-staging
        CAND="$$(gcloud run services describe "$$CRMSVC" --project="$PROJECT_ID" --region="$$REGION" --format='value(status.latestCreatedRevisionName)')"
        TAG="$$(gcloud run services describe "$$CRMSVC" --project="$PROJECT_ID" --region="$$REGION" --format=json \
          | python3 -c "import json,sys; s=json.load(sys.stdin); t=next((x for x in s.get('status',{}).get('trafficStatuses',[]) if x.get('tag')=='crm-candidate'),{}); print(t.get('url',''))")"
        curl -fsS -o /dev/null "$$TAG"
        gcloud run services update-traffic "$$CRMSVC" --project="$PROJECT_ID" --region="$$REGION" --to-revisions="$$CAND=100" --quiet
        echo "crm_live_rev=$$CAND"

options:
  logging: CLOUD_LOGGING_ONLY
