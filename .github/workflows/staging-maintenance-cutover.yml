name: Staging maintenance cutover

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPROVE-STAGING-CUTOVER to confirm'
        required: true
        type: string
      alert_email:
        description: 'Monitoring alert email'
        required: true
        type: string
      release_sha:
        description: 'Expected git SHA (must match HEAD)'
        required: true
        type: string
        default: a41642ebee9e5604d23e022c5c63cecde94e359f

concurrency:
  group: staging-maintenance-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: github.event.inputs.confirm == 'APPROVE-STAGING-CUTOVER'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      GCP_STAGING_PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      GCP_STAGING_DEPLOYER_SA: ${{ vars.GCP_STAGING_DEPLOYER_SA }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      CLOUDBUILD_SA: clinic-staging-cloudbuild@${{ vars.GCP_STAGING_PROJECT_ID }}.iam.gserviceaccount.com
      RUNNER_SA: clinic-staging-runner@${{ vars.GCP_STAGING_PROJECT_ID }}.iam.gserviceaccount.com
      STAGING_ALERT_EMAIL: ${{ github.event.inputs.alert_email }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_sha }}

      - name: Pin release SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.inputs.release_sha }}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_STAGING_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_STAGING_PROJECT_ID }}

      - name: Record rollback + preflight
        run: |
          set -euo pipefail
          chmod +x apps/api/scripts/staging-restore-drill.sh infra/staging/bootstrap-staging-secrets.sh
          chmod +x scripts/staging-monitoring-setup.sh
          if [ -f scripts/staging-monitoring-alerts.sh ]; then chmod +x scripts/staging-monitoring-alerts.sh; fi
          echo "rollback_api=$(gcloud run services describe clinic-api-staging --region=asia-south1 --format='value(status.traffic[0].revisionName)')"
          echo "rollback_crm=$(gcloud run services describe kaana-clinic-staging --region=asia-south1 --format='value(status.traffic[0].revisionName)')"
          chmod +x scripts/staging-backup-health.sh
          GCP_STAGING_PROJECT_ID="$GCP_STAGING_PROJECT_ID" bash scripts/staging-backup-health.sh
          GCP_STAGING_PROJECT_ID="$GCP_STAGING_PROJECT_ID" bash apps/api/scripts/staging-restore-drill.sh --sync-only
          test "$(gcloud storage ls "gs://${GCP_STAGING_PROJECT_ID}-clinic-db/clinic-files-staging/denta-care/" | wc -l)" -ge 4

      - name: Secrets and monitoring
        run: |
          set -euo pipefail
          for SA in "${RUNNER_SA}" "${CLOUDBUILD_SA}" ""; do
            export GCP_IMPERSONATE_SA="$SA"
            if GCP_STAGING_PROJECT_ID="$GCP_STAGING_PROJECT_ID" bash infra/staging/bootstrap-staging-secrets.sh; then
              break
            fi
          done
          export STAGING_API_URL="$(gcloud run services describe clinic-api-staging --region=asia-south1 --format='value(status.url)')"
          export STAGING_CRM_URL="$(gcloud run services describe kaana-clinic-staging --region=asia-south1 --format='value(status.url)')"
          bash scripts/staging-monitoring-setup.sh || true
          git fetch origin main --depth=1
          if git show origin/main:scripts/staging-monitoring-alerts.sh > /tmp/staging-monitoring-alerts.sh 2>/dev/null; then
            chmod +x /tmp/staging-monitoring-alerts.sh
            bash /tmp/staging-monitoring-alerts.sh || true
          fi

      - name: Quiesce writer and shift API traffic
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:cloudbuild.staging-traffic.yaml > cloudbuild.staging-traffic.yaml
          BUILD_ID="$(gcloud builds submit \
            --project "$GCP_STAGING_PROJECT_ID" \
            --config cloudbuild.staging-traffic.yaml \
            --service-account="projects/${GCP_STAGING_PROJECT_ID}/serviceAccounts/${CLOUDBUILD_SA}" \
            --format='value(id)' \
            .)"
          gcloud builds log "$BUILD_ID" --project "$GCP_STAGING_PROJECT_ID" --stream
          test "$(gcloud builds describe "$BUILD_ID" --project "$GCP_STAGING_PROJECT_ID" --format='value(status)')" = SUCCESS

      - name: Deploy CRM and shift traffic
        run: |
          set -euo pipefail
          BUILD_ID="$(gcloud builds submit --project "$GCP_STAGING_PROJECT_ID" \
            --config cloudbuild.staging-crm.yaml \
            --service-account="projects/${GCP_STAGING_PROJECT_ID}/serviceAccounts/${CLOUDBUILD_SA}" \
            --format='value(id)' \
            .)"
          gcloud builds log "$BUILD_ID" --project "$GCP_STAGING_PROJECT_ID" --stream
          test "$(gcloud builds describe "$BUILD_ID" --project "$GCP_STAGING_PROJECT_ID" --format='value(status)')" = SUCCESS
          git fetch origin main --depth=1
          git show origin/main:cloudbuild.staging-crm-traffic.yaml > cloudbuild.staging-crm-traffic.yaml
          BUILD_ID2="$(gcloud builds submit \
            --project "$GCP_STAGING_PROJECT_ID" \
            --config cloudbuild.staging-crm-traffic.yaml \
            --service-account="projects/${GCP_STAGING_PROJECT_ID}/serviceAccounts/${CLOUDBUILD_SA}" \
            --format='value(id)' \
            .)"
          gcloud builds log "$BUILD_ID2" --project "$GCP_STAGING_PROJECT_ID" --stream
          test "$(gcloud builds describe "$BUILD_ID2" --project "$GCP_STAGING_PROJECT_ID" --format='value(status)')" = SUCCESS

      - name: Staging ops validate
        run: |
          set -euo pipefail
          BUILD_ID="$(gcloud builds submit \
            --project "$GCP_STAGING_PROJECT_ID" \
            --config cloudbuild.staging-ops.yaml \
            --substitutions="_COMMIT_SHA=${{ github.event.inputs.release_sha }}" \
            --service-account="projects/${GCP_STAGING_PROJECT_ID}/serviceAccounts/${CLOUDBUILD_SA}" \
            --format='value(id)' \
            .)"
          gcloud builds log "$BUILD_ID" --project "$GCP_STAGING_PROJECT_ID" --stream
          test "$(gcloud builds describe "$BUILD_ID" --project "$GCP_STAGING_PROJECT_ID" --format='value(status)')" = "SUCCESS"
