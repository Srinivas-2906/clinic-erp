# STAGING — manual only. Separate GCP project (NOT crucial-accord-505607-g9).
# See infra/staging/ARCHITECTURE.md

name: Deploy staging (manual — approval required)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-staging to confirm'
        required: true
        type: string

concurrency:
  group: deploy-clinic-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging Cloud Run
    if: github.event.inputs.confirm == 'deploy-staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      GCP_STAGING_PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      GCP_STAGING_DEPLOYER_SA: ${{ vars.GCP_STAGING_DEPLOYER_SA }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging isolation
        run: |
          set -euo pipefail
          test -n "$GCP_STAGING_PROJECT_ID" || { echo "Missing repo variable GCP_STAGING_PROJECT_ID"; exit 1; }
          test -n "$GCP_STAGING_DEPLOYER_SA" || { echo "Missing repo variable GCP_STAGING_DEPLOYER_SA"; exit 1; }
          test -n "$GCP_WIF_PROVIDER" || { echo "Missing repo variable GCP_WIF_PROVIDER"; exit 1; }
          if [ "$GCP_STAGING_PROJECT_ID" = "crucial-accord-505607-g9" ]; then
            echo "Refusing to run staging deploy against production project"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_STAGING_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_STAGING_PROJECT_ID }}

      - name: Submit Cloud Build (staging)
        run: |
          set -euo pipefail
          CLOUDBUILD_SA="clinic-staging-cloudbuild@${GCP_STAGING_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud builds submit \
            --project "$GCP_STAGING_PROJECT_ID" \
            --config cloudbuild.staging.yaml \
            --service-account="projects/$GCP_STAGING_PROJECT_ID/serviceAccounts/${CLOUDBUILD_SA}" \
            .
