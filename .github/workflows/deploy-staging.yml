# STAGING — manual only. Not enabled until GCP staging resources + WIF vars exist.
# See infra/staging/README.md and docs/modernization/05_M2_CANONICAL_REPO.md

name: Deploy staging (manual — approval required)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-staging to confirm'
        required: true
        type: string

concurrency:
  group: deploy-clinic-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging Cloud Run
    if: github.event.inputs.confirm == 'deploy-staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kaana-prod

      - name: Submit Cloud Build (staging)
        run: |
          gcloud builds submit \
            --project kaana-prod \
            --config cloudbuild.staging.yaml \
            --service-account=projects/kaana-prod/serviceAccounts/kaana-cloudbuild-deployer@kaana-prod.iam.gserviceaccount.com \
            .
