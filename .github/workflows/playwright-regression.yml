# Extended Playwright regression — async (not a PR merge gate). Failures must be triaged before release.
name: Playwright extended regression

on:
  schedule:
    - cron: '30 1 * * *' # 07:00 IST nightly
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pw-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Playwright regression (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: apps/crm/.pw-browsers
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-browsers-${{ runner.os }}-
      - name: Install Linux native modules for Vite (Playwright webServer)
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu
      - name: Install Playwright + full E2E
        env:
          DATABASE_PATH: ${{ github.workspace }}/apps/api/data/e2e/clinic.db
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/crm/.pw-browsers
        run: npm run test:e2e:install --workspace=apps/crm && npm run test:e2e:full --workspace=apps/crm
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report-${{ github.run_id }}
          path: apps/crm/e2e/report
          retention-days: 14
