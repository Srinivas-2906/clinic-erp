# Deferred native Android — Maestro on emulator (manual only). Not part of web SaaS CI.
name: Android Maestro verify (manual)

on:
  workflow_dispatch:
    inputs:
      maestro_flows:
        description: 'Comma-separated flows (empty = full suite). Example: login-smoke.yaml'
        required: false
        default: ''

concurrency:
  group: android-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk-build:
    name: Android APK build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_CLINIC_API: http://10.0.2.2:3010
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace=apps/mobile
      - run: npm test --workspace=apps/mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        run: chmod +x apps/mobile/scripts/setup-android-sdk-ci.sh apps/mobile/scripts/build-android-apk.sh && bash apps/mobile/scripts/setup-android-sdk-ci.sh
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build release APK
        env:
          FORCE_ANDROID_APK_BUILD: "1"
        run: bash apps/mobile/scripts/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-mobile-release-apk
          path: apps/mobile/build/clinic-mobile-release.apk
          retention-days: 7

  mobile-maestro-android:
    name: Native Android Maestro
    runs-on: ubuntu-latest
    needs: [android-apk-build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: clinic-mobile-release-apk
          path: apps/mobile/build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro CLI
        run: chmod +x apps/mobile/scripts/setup-maestro-ci.sh && bash apps/mobile/scripts/setup-maestro-ci.sh
      - name: Emulator runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0
      - name: Run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DATABASE_PATH: ${{ github.workspace }}/apps/api/data/e2e/clinic.db
          APK_PATH: ${{ github.workspace }}/apps/mobile/build/clinic-mobile-release.apk
          MAESTRO_CLINIC_EMAIL: e2e-receptionist@dentacare.in
          MAESTRO_CLINIC_PASSWORD: E2eTest@2026
          MAESTRO_CLINIC_TENANT: dentacare
          MAESTRO_FLOWS: ${{ inputs.maestro_flows }}
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -memory 4096 -no-boot-anim -no-audio
          emulator-boot-timeout: 900
          script: chmod +x apps/mobile/scripts/run-maestro-android.sh && bash apps/mobile/scripts/run-maestro-android.sh
      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-failure
          path: |
            ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore
