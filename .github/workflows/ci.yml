name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:api
      - name: Release preflight (CI mode)
        run: node apps/api/scripts/release-preflight.js
      - name: Billing API smoke
        run: node apps/api/scripts/billing-api-smoke.js

  crm-unit-tests:
    name: CRM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Linux native modules for Vitest/Vite
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu
      - run: npm test --workspace=apps/crm

  mobile-checks:
    name: Mobile typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace=apps/mobile
      - run: npm test --workspace=apps/mobile

  mobile-maestro-android:
    name: Native Android Maestro
    runs-on: ubuntu-latest
    needs: [mobile-checks, api-tests]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DATABASE_PATH: ${{ github.workspace }}/apps/api/data/e2e/clinic.db
          MAESTRO_CLINIC_EMAIL: e2e-receptionist@dentacare.in
          MAESTRO_CLINIC_PASSWORD: E2eTest@2026
          MAESTRO_CLINIC_TENANT: dentacare
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: chmod +x apps/mobile/scripts/run-android-maestro.sh && bash apps/mobile/scripts/run-android-maestro.sh
      - name: Upload Maestro logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-failure
          path: |
            ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

  crm-build:
    name: CRM production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Linux native modules for Vite build
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu
      - run: npm run build --workspace=apps/crm

  docker-build-smoke:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t clinic-api:ci .
      - run: |
          docker build -f apps/crm/Dockerfile -t clinic-crm:ci \
            --build-arg VITE_CLINIC_API=/api \
            --build-arg VITE_TENANT_SLUG=dentacare \
            .

  playwright-smoke:
    name: Playwright smoke (local, no GCP)
    runs-on: ubuntu-latest
    needs: [api-tests, crm-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Linux native modules for Vite (Playwright webServer)
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu
      - name: E2E smoke (@smoke)
        env:
          DATABASE_PATH: ${{ github.workspace }}/apps/api/data/e2e/clinic.db
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/crm/.pw-browsers
        run: npm run test:e2e:install --workspace=apps/crm && npm run test:e2e:smoke --workspace=apps/crm
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: apps/crm/e2e/report
          retention-days: 7

  playwright-regression:
    name: Playwright regression (desktop + mobile)
    runs-on: ubuntu-latest
    needs: [playwright-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Linux native modules for Vite (Playwright webServer)
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu
      - name: Install Playwright + full E2E
        env:
          DATABASE_PATH: ${{ github.workspace }}/apps/api/data/e2e/clinic.db
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/crm/.pw-browsers
        run: npm run test:e2e:install --workspace=apps/crm && npm run test:e2e:full --workspace=apps/crm
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: apps/crm/e2e/report
          retention-days: 7
