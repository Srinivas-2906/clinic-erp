# Web SaaS merge gate (API + CRM + Docker + Playwright fast). Native Android: native-android-verify.yml (manual).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:api
      - name: Release preflight (CI mode)
        run: node apps/api/scripts/release-preflight.js
      - name: Billing API smoke
        run: node apps/api/scripts/billing-api-smoke.js

  crm-unit-tests:
    name: CRM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Linux native modules for Vitest/Vite
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu
      - run: npm test --workspace=apps/crm

  crm-build:
    name: CRM production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Linux native modules for Vite build
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu
      - run: npm run build --workspace=apps/crm

  docker-build-smoke:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t clinic-api:ci .
      - run: |
          docker build -f apps/crm/Dockerfile -t clinic-crm:ci \
            --build-arg VITE_CLINIC_API=/api \
            --build-arg VITE_TENANT_SLUG=dentacare \
            .

  playwright-fast:
    name: Playwright fast (smoke + auth)
    runs-on: ubuntu-latest
    needs: [api-tests, crm-build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: apps/crm/.pw-browsers
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-browsers-${{ runner.os }}-
      - name: Install Linux native modules for Vite (Playwright webServer)
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu
      - name: E2E smoke desktop + mobile (@smoke)
        env:
          DATABASE_PATH: ${{ github.workspace }}/apps/api/data/e2e/clinic.db
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/crm/.pw-browsers
        run: npm run test:e2e:install --workspace=apps/crm && npm run test:e2e:smoke:both --workspace=apps/crm
      - name: E2E authorization + API contracts
        env:
          DATABASE_PATH: ${{ github.workspace }}/apps/api/data/e2e/clinic.db
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/crm/.pw-browsers
        run: npm run test:e2e:security --workspace=apps/crm
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fast-report
          path: apps/crm/e2e/report
          retention-days: 7
