name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - run: npm run test:api

  crm-unit-tests:
    name: CRM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - run: npm test --workspace=apps/crm

  crm-build:
    name: CRM production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - run: npm run build --workspace=apps/crm

  docker-build-smoke:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clinic-api:ci ./apps/api
      - run: |
          docker build -t clinic-crm:ci \
            --build-arg VITE_CLINIC_API=/api \
            --build-arg VITE_TENANT_SLUG=dentacare \
            ./apps/crm
