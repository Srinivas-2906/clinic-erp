# Staging infrastructure ops — Cloud Build (Secret Manager via cloudbuild SA). Manual or post-deploy.
name: Staging ops (validate, scheduler, monitoring)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type run-staging-ops to confirm'
        required: true
        type: string
  workflow_run:
    workflows: ['Deploy staging (manual — approval required)']
    types: [completed]

concurrency:
  group: staging-ops
  cancel-in-progress: false

jobs:
  ops:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'run-staging-ops')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      GCP_STAGING_PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      GCP_STAGING_DEPLOYER_SA: ${{ vars.GCP_STAGING_DEPLOYER_SA }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging isolation
        run: |
          set -euo pipefail
          test -n "$GCP_STAGING_PROJECT_ID"
          test "$GCP_STAGING_PROJECT_ID" != "crucial-accord-505607-g9"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_STAGING_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_STAGING_PROJECT_ID }}

      - name: Bootstrap staging secrets and secret IAM
        env:
          CLOUDBUILD_SA: clinic-staging-cloudbuild@${{ vars.GCP_STAGING_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          export GCP_STAGING_PROJECT_ID="${{ vars.GCP_STAGING_PROJECT_ID }}"
          export GCP_IMPERSONATE_SA="${CLOUDBUILD_SA}"
          chmod +x infra/staging/bootstrap-staging-secrets.sh scripts/staging-secret-preflight.sh
          bash infra/staging/bootstrap-staging-secrets.sh || {
            echo "Impersonated bootstrap failed; trying Cloud Build IAM config (default builder SA)…"
            gcloud builds submit \
              --project "$GCP_STAGING_PROJECT_ID" \
              --config cloudbuild.staging-iam.yaml \
              --format='value(id)' \
              . >/dev/null
          }
          bash scripts/staging-secret-preflight.sh

      - name: Submit staging ops Cloud Build
        run: |
          set -euo pipefail
          CLOUDBUILD_SA="clinic-staging-cloudbuild@${GCP_STAGING_PROJECT_ID}.iam.gserviceaccount.com"
          BUILD_ID="$(gcloud builds submit \
            --project "$GCP_STAGING_PROJECT_ID" \
            --config cloudbuild.staging-ops.yaml \
            --substitutions="_COMMIT_SHA=${GITHUB_SHA}" \
            --service-account="projects/$GCP_STAGING_PROJECT_ID/serviceAccounts/${CLOUDBUILD_SA}" \
            --format='value(id)' \
            .)"
          echo "Cloud Build ID: ${BUILD_ID}"
          gcloud builds log "$BUILD_ID" --project "$GCP_STAGING_PROJECT_ID" --stream
          STATUS="$(gcloud builds describe "$BUILD_ID" --project "$GCP_STAGING_PROJECT_ID" --format='value(status)')"
          test "$STATUS" = "SUCCESS"
