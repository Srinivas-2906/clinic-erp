# Deferred native Android — manual only. Does not run on PR/push. Use before a native release cycle.
name: Native Android verify (manual)

on:
  workflow_dispatch:
    inputs:
      skip_apk:
        description: 'Skip APK build (typecheck + unit only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: native-android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-checks:
    name: Mobile typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace=apps/mobile
      - run: npm test --workspace=apps/mobile

  android-apk-build:
    name: Android APK build
    runs-on: ubuntu-latest
    needs: [mobile-checks]
    if: inputs.skip_apk != true
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_CLINIC_API: http://10.0.2.2:3010
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        run: chmod +x apps/mobile/scripts/setup-android-sdk-ci.sh apps/mobile/scripts/build-android-apk.sh && bash apps/mobile/scripts/setup-android-sdk-ci.sh
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build release APK
        env:
          FORCE_ANDROID_APK_BUILD: "1"
        run: bash apps/mobile/scripts/build-android-apk.sh
      - name: Verify APK artifact
        run: test -f apps/mobile/build/clinic-mobile-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-mobile-release-apk
          path: apps/mobile/build/clinic-mobile-release.apk
          retention-days: 7
